<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Care Navigator Local</title>
<style>
  :root {
    --bg: #f2f2f7; --panel: #ffffff; --ink: #1c1c1e; --muted: #6e6e73; --line: #d1d1d6;
    --me: #0a84ff; --me-ink: #ffffff; --them: #e9e9eb; --them-ink: #1c1c1e;
    --chip: #ffffff; --chip-ink: #0a63c9; --warn: #c4291c; --link: #0a63c9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000; --panel: #1c1c1e; --ink: #f2f2f7; --muted: #98989f; --line: #38383a;
      --them: #2c2c2e; --them-ink: #f2f2f7; --chip: #1c1c1e; --chip-ink: #64aaff; --warn: #ff6b5e; --link: #64aaff;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center;
  }
  .app { width: 100%; max-width: 560px; height: 100dvh; display: flex; flex-direction: column; background: var(--panel); }
  header {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--me); color: #fff;
            display: grid; place-items: center; font-weight: 600; flex: none; }
  .who { flex: 1; min-width: 0; }
  .who b { display: block; font-size: 16px; }
  .who span { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  header button { font: inherit; font-size: 14px; color: var(--chip-ink); background: none; border: 0; cursor: pointer; padding: 6px; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
  .note { align-self: center; font-size: 12px; color: var(--muted); text-align: center; margin: 8px 0; max-width: 90%; }
  .msg { max-width: 82%; padding: 8px 12px; border-radius: 18px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .me { align-self: flex-end; background: var(--me); color: var(--me-ink); border-bottom-right-radius: 6px; }
  .them { align-self: flex-start; background: var(--them); color: var(--them-ink); border-bottom-left-radius: 6px; }
  .them a { color: var(--link); }
  .me img { display: block; max-width: 200px; border-radius: 12px; }
  .meta { font-size: 11px; color: var(--muted); align-self: flex-start; margin: 0 4px 6px; }
  .meta.right { align-self: flex-end; }
  .typing { display: inline-flex; gap: 4px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25 } 40% { opacity: 1 } }
  @media (prefers-reduced-motion: reduce) { .typing i { animation: none; opacity: .6; } }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 8px 16px; border-top: 1px solid var(--line); scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button {
    flex: none; font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 16px;
    border: 1px solid var(--line); background: var(--chip); color: var(--chip-ink); cursor: pointer;
  }
  .chips button.danger { color: var(--warn); }
  form { display: flex; gap: 8px; align-items: flex-end; padding: 8px 16px calc(12px + env(safe-area-inset-bottom)); }
  .attach { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line);
            background: var(--chip); color: var(--muted); display: grid; place-items: center; cursor: pointer; }
  .attach input { display: none; }
  textarea {
    flex: 1; min-width: 0; resize: none; font: inherit; color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 18px; padding: 7px 14px; max-height: 120px;
  }
  textarea:focus { outline: 2px solid var(--me); outline-offset: -1px; }
  .send { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--me); color: #fff; cursor: pointer; }
  .send:disabled { opacity: .4; cursor: default; }
  .preview { display: none; padding: 0 16px; font-size: 12px; color: var(--muted); }
  .preview.on { display: block; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar" aria-hidden="true">CN</div>
    <div class="who"><b>Care Navigator</b><span id="phone">local</span></div>
    <button type="button" id="newUser" title="Start over as a new user">New user</button>
  </header>

  <div id="log" aria-live="polite">
    <div class="note">Local chat. Same assistant as the iMessage line: real database and Gemini, nothing is texted.
      This is not for emergencies. Call 911.</div>
  </div>

  <div class="chips" id="chips" aria-label="Demo shortcuts"></div>
  <div class="preview" id="preview"></div>
  <form id="form">
    <label class="attach" title="Attach insurance card photo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg>
      <input type="file" id="file" accept="image/*">
      <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Attach photo</span>
    </label>
    <textarea id="text" rows="1" placeholder="Text Care Navigator" aria-label="Message"></textarea>
    <button class="send" id="send" type="submit" aria-label="Send">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </form>
</div>

<script>
const DEMO = [
  "#profile kaiser", "#profile medi_cal", "#profile uninsured",
  "think i sprained my ankle", "UCSD",
  "my chest hurts and my arm is numb", "#followup", "3",
  "#whoami", "HELP", "#lang es", "#lang en", "#reset",
];
const $ = (id) => document.getElementById(id);
const log = $("log"), text = $("text"), sendBtn = $("send"), fileIn = $("file"), preview = $("preview");
let busy = false, pendingImage = null;

function store(get, key, value) {
  try { return get ? localStorage.getItem(key) : localStorage.setItem(key, value); } catch { return null; }
}
function freshPhone() { return "+1555" + String(Math.floor(Math.random() * 1e7)).padStart(7, "0"); }
let phone = store(true, "cn_phone") || freshPhone();
store(false, "cn_phone", phone);
function showPhone() { $("phone").textContent = "local · test number " + phone; }
showPhone();

function esc(s) { return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }
function linkify(s) {
  return esc(s).replace(/https?:\/\/[^\s)]+/g, (u) => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
}
function time() { return new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); }
function scroll() { log.scrollTop = log.scrollHeight; }

function bubble(who, content, { html = false, image = null } = {}) {
  const el = document.createElement("div");
  el.className = "msg " + who;
  if (image) { const img = document.createElement("img"); img.src = image; img.alt = "Card photo"; el.appendChild(img); }
  if (content) {
    const span = document.createElement("div");
    if (html) span.innerHTML = content; else span.textContent = content;
    el.appendChild(span);
  }
  log.appendChild(el);
  scroll();
  return el;
}
function meta(label, right) {
  const m = document.createElement("div");
  m.className = "meta" + (right ? " right" : "");
  m.textContent = label;
  log.appendChild(m);
  scroll();
}

async function send(message) {
  const body = (message ?? text.value).trim();
  if (busy || (!body && !pendingImage)) return;
  busy = true; sendBtn.disabled = true;
  const image = pendingImage; pendingImage = null; preview.className = "preview"; fileIn.value = "";
  bubble("me", body, { image });
  meta(time(), true);
  if (message === undefined) { text.value = ""; autosize(); }
  const typing = bubble("them", '<span class="typing" aria-label="typing"><i></i><i></i><i></i></span>', { html: true });
  const t0 = performance.now();
  try {
    const resp = await fetch("/send", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ phone, text: body, image_b64: image }),
    });
    const data = await resp.json().catch(() => ({}));
    typing.remove();
    if (!resp.ok) throw new Error(data.detail || resp.status);
    const replies = data.replies || [];
    if (!replies.length) bubble("them", "(no reply: this number texted STOP; send START)");
    replies.forEach((r) => bubble("them", linkify(r), { html: true }));
    meta(`${time()} · ${((performance.now() - t0) / 1000).toFixed(1)} s`);
  } catch (e) {
    typing.remove();
    bubble("them", "Could not reach the local server: " + e.message);
  } finally {
    busy = false; sendBtn.disabled = false; text.focus();
  }
}

function autosize() { text.style.height = "auto"; text.style.height = Math.min(text.scrollHeight, 120) + "px"; }
text.addEventListener("input", autosize);
text.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
$("form").addEventListener("submit", (e) => { e.preventDefault(); send(); });

fileIn.addEventListener("change", () => {
  const f = fileIn.files[0];
  if (!f) return;
  if (f.size > 8 * 1024 * 1024) { preview.textContent = "Photo is over 8 MB."; preview.className = "preview on"; return; }
  const reader = new FileReader();
  reader.onload = () => {
    pendingImage = reader.result;
    preview.textContent = `Photo attached: ${f.name}. Press send.`;
    preview.className = "preview on";
  };
  reader.readAsDataURL(f);
});

const chips = $("chips");
DEMO.forEach((m) => {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = m;
  if (m.startsWith("my chest")) b.className = "danger";
  b.addEventListener("click", () => send(m));
  chips.appendChild(b);
});

$("newUser").addEventListener("click", () => {
  phone = freshPhone(); store(false, "cn_phone", phone); showPhone();
  log.innerHTML = '<div class="note">New user. Text anything to start onboarding, or tap #profile kaiser.</div>';
  text.focus();
});
text.focus();
</script>
</body>
</html>
